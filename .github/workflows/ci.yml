name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,extract]"

      - name: Lint
        run: ruff check packages tests scripts

      - name: Validate the roster, missions and tools
        # This is the check that matters most: a broken agent or a mission
        # referencing a tool that does not exist must never reach a client's
        # site, and it is cheap to catch here.
        run: python -m seoos.cli check
        env:
          PYTHONPATH: ${{ github.workspace }}/packages

      - name: Generated TypeScript is current
        # roster.generated.ts and ads.generated.ts are written from the Python
        # registries. The browser reads them, so a stale copy means the
        # interface promises a roster or a refusal the runtime does not have.
        run: |
          python scripts/roster_to_ts.py
          python scripts/ads_to_ts.py
          git diff --quiet -- apps/web/src/lib/roster.generated.ts apps/web/src/engine/ads.generated.ts || {
            echo "::error::Generated TypeScript is stale. Run 'make docs' and commit."
            git diff --stat -- apps/web/src/lib/roster.generated.ts apps/web/src/engine/ads.generated.ts
            exit 1
          }
        env:
          PYTHONPATH: ${{ github.workspace }}/packages

      - name: Reference documentation is current
        # The reference is generated from the registries. A new tool, check,
        # agent or mission that lands without regenerating it fails here.
        run: |
          python scripts/generate_reference.py
          git diff --quiet -- docs/reference || {
            echo "::error::docs/reference is stale. Run 'make docs' and commit."
            git diff -- docs/reference | head -60
            exit 1
          }
        env:
          PYTHONPATH: ${{ github.workspace }}/packages

      - name: Test
        run: pytest tests/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}/packages

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests
        # The browser engine decides what a client is told about their own
        # site and whether their money may be spent. It is not optional here.
        run: npm run test:engine

      - name: Our own site passes our own checks
        run: |
          npm run seo:check
          npm run brand:check

      - name: Build
        # The one step that evaluates every module. A typecheck passes on a
        # temporal dead zone violation, because TypeScript cannot know a
        # filter callback is synchronous, and only the prerender throws.
        # That exact bug reached main once and Cloudflare silently kept
        # serving the previous version for an hour.
        run: npm run build

      - name: Cloudflare bundle
        # Cloudflare builds from this repository on every push to main. Building
        # the Worker here means a change that breaks the deployment fails in a
        # pull request rather than on the live site.
        # The dry run triggers wrangler.jsonc's build command itself, so this
        # exercises the same path Cloudflare takes, without credentials.
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle

  docker:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t seoos-api:ci .
      - name: Build the web image
        run: docker build -f deploy/Dockerfile.web -t seoos-web:ci .
