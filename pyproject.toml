[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seoos"
version = "0.1.0"
description = "SEO OS - an autonomous search growth platform that replaces the work of an SEO agency"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  # web + async
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "itsdangerous>=2.2,<3.0",
  "email-validator>=2.2,<3.0",

  # persistence
  "sqlalchemy>=2.0.35,<3.0",
  "alembic>=1.13,<2.0",
  "greenlet>=3.0,<4.0",

  # security
  "cryptography>=43.0,<48.0",
  "bcrypt>=4.0,<6.0",
  "pyjwt>=2.9,<3.0",

  # scheduling
  "croniter>=3.0,<7.0",

  # parsing / analysis (shared with the plugin's scripts)
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.3,<7.0",
  "PyYAML>=6.0,<7.0",
  "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1.0", "psycopg[binary]>=3.2,<4.0"]
redis = ["redis>=5.1,<7.0"]
extract = ["trafilatura>=2.0,<3.0", "pypdf>=5.0,<7.0", "python-docx>=1.1,<2.0"]
render = ["playwright>=1.48,<2.0"]
reports = ["matplotlib>=3.8,<4.0", "weasyprint>=62,<70"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
seoos = "seoos.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["seoos*"]

[tool.setuptools.package-data]
seoos = ["agents/specs/*.yaml", "missions/workflows/*.yaml", "**/*.sql", "**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
